services:
  mysql:
    image: mysql:8.4
    container_name: pilot-sony-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sony_badges
      MYSQL_USER: sony
      MYSQL_PASSWORD: sony
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -usony -psony --silent"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql-data:
