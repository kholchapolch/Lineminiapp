name: Deploy Next.js UAT site

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-nextjs-uat
  cancel-in-progress: true

jobs:
  build:
    name: Validate and package
    runs-on: windows-latest
    environment: uat
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm

      - name: Create build environment file
        shell: pwsh
        env:
          UAT_ENV_FILE: ${{ secrets.UAT_ENV_FILE }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:UAT_ENV_FILE)) {
            throw "UAT_ENV_FILE is required in the uat GitHub environment."
          }

          $content = $env:UAT_ENV_FILE.TrimEnd() + [Environment]::NewLine
          [System.IO.File]::WriteAllText(
            (Join-Path $PWD ".env.production"),
            $content,
            [System.Text.UTF8Encoding]::new($false)
          )

      - name: Validate UAT environment
        run: npm run config:check

      - name: Install dependencies
        run: npm ci

      - name: Verify generated database seed
        run: npm run db:seed:sql:check

      - name: Run tests
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Build application
        run: npm run build

      - name: Prepare production server package
        shell: pwsh
        run: |
          Remove-Item -Path .next/cache -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path deploy | Out-Null
          Copy-Item -Path .next -Destination deploy/.next -Recurse -Force
          Copy-Item -Path public -Destination deploy/public -Recurse -Force
          Copy-Item -Path server.js -Destination deploy/server.js -Force
          Copy-Item -Path package.json -Destination deploy/package.json -Force
          Copy-Item -Path package-lock.json -Destination deploy/package-lock.json -Force
          Copy-Item -Path next.config.mjs -Destination deploy/next.config.mjs -Force
          Copy-Item -Path web.config -Destination deploy/web.config -Force
          npm ci --omit=dev --prefix deploy

      - name: Upload deployment package
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-production-server
          path: deploy
          if-no-files-found: error
          include-hidden-files: true

      - name: Remove build environment file
        if: always()
        shell: pwsh
        run: Remove-Item -Path .env.production -Force -ErrorAction SilentlyContinue

  deploy:
    name: Deploy and verify
    runs-on: ubuntu-latest
    needs: build
    environment: uat

    steps:
      - name: Download deployment package
        uses: actions/download-artifact@v4
        with:
          name: nextjs-production-server
          path: deploy

      - name: Create runtime environment file
        shell: bash
        env:
          UAT_ENV_FILE: ${{ secrets.UAT_ENV_FILE }}
        run: |
          if [ -z "$UAT_ENV_FILE" ]; then
            echo "UAT_ENV_FILE is required in the uat GitHub environment." >&2
            exit 1
          fi

          printf '%s\n' "$UAT_ENV_FILE" > deploy/.env.production
          chmod 600 deploy/.env.production

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: mysonybadgestg
          slot-name: Production
          package: deploy
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_65CDA25D8ED242478BC3E40CB7D2134E }}

      - name: Remove runtime environment file from runner
        if: always()
        shell: bash
        run: rm -f deploy/.env.production

      - name: Verify custom domain
        shell: bash
        run: |
          check_endpoint() {
            local url="$1"
            local expected="${2:-}"
            local headers
            local body
            local status

            headers="$(mktemp)"
            body="$(mktemp)"
            status="$(curl --silent --show-error --location \
              --retry 12 \
              --retry-all-errors \
              --retry-delay 10 \
              --dump-header "$headers" \
              --output "$body" \
              --write-out '%{http_code}' \
              "$url")"

            if [ "$status" = "403" ] && grep --ignore-case --quiet '^x-ms-forbidden-ip:' "$headers"; then
              echo "::warning::Runtime verification skipped because Azure Access Restrictions blocked the GitHub runner: $url"
              rm -f "$headers" "$body"
              return 0
            fi

            if [[ "$status" != 2* ]]; then
              echo "Unexpected HTTP $status from $url" >&2
              cat "$headers" >&2
              rm -f "$headers" "$body"
              return 1
            fi

            if [ -n "$expected" ] && ! grep --fixed-strings --quiet "$expected" "$body"; then
              echo "Expected response marker was not found for $url" >&2
              rm -f "$headers" "$body"
              return 1
            fi

            rm -f "$headers" "$body"
          }

          check_endpoint "https://stglineminiapp.sony.co.th/"
          check_endpoint "https://stglineminiapp.sony.co.th/api/health" '"runtime":"nodejs"'
          check_endpoint "https://stglineminiapp.sony.co.th/deployment-check.html" "Deployment smoke test passed."
