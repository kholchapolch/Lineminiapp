name: Deploy Next.js UAT site

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-nextjs-uat
  cancel-in-progress: true

jobs:
  build:
    name: Validate and package
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Build application
        run: npm run build

      - name: Prepare production server package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path deploy | Out-Null
          Copy-Item -Path .next -Destination deploy/.next -Recurse -Force
          Copy-Item -Path public -Destination deploy/public -Recurse -Force
          Copy-Item -Path server.js -Destination deploy/server.js -Force
          Copy-Item -Path package.json -Destination deploy/package.json -Force
          Copy-Item -Path package-lock.json -Destination deploy/package-lock.json -Force
          Copy-Item -Path next.config.mjs -Destination deploy/next.config.mjs -Force
          Copy-Item -Path web.config -Destination deploy/web.config -Force
          npm ci --omit=dev --prefix deploy

      - name: Upload deployment package
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-production-server
          path: deploy
          if-no-files-found: error
          include-hidden-files: true

  deploy:
    name: Deploy and verify
    runs-on: ubuntu-latest
    needs: build
    environment: uat

    steps:
      - name: Download deployment package
        uses: actions/download-artifact@v4
        with:
          name: nextjs-production-server
          path: deploy

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: mysonybadgestg
          slot-name: Production
          package: deploy
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_65CDA25D8ED242478BC3E40CB7D2134E }}

      - name: Verify custom domain
        run: |
          curl --fail --silent --show-error \
            --retry 12 \
            --retry-all-errors \
            --retry-delay 10 \
            https://stglineminiapp.sony.co.th/ \
            | grep --fixed-strings \
                "Framework dependencies are ready for source integration." \
                > /dev/null
          curl --fail --silent --show-error \
            --retry 12 \
            --retry-all-errors \
            --retry-delay 10 \
            https://stglineminiapp.sony.co.th/api/health \
            | grep --fixed-strings '"runtime":"nodejs"' > /dev/null
          curl --fail --silent --show-error \
            --retry 12 \
            --retry-all-errors \
            --retry-delay 10 \
            https://stglineminiapp.sony.co.th/deployment-check.html \
            | grep --fixed-strings "Deployment smoke test passed." > /dev/null
