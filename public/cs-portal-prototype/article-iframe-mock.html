<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Article Mock</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 24px 20px 40px;
        font-family: ui-sans-serif, system-ui, sans-serif;
        color: #111827;
        background: #fff;
        line-height: 1.5;
      }

      .eyebrow {
        margin: 0 0 8px;
        color: #005ece;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 22px;
        line-height: 1.3;
      }

      p {
        margin: 0 0 14px;
        color: #4b5563;
        font-size: 15px;
      }

      .hero {
        display: block;
        width: 100%;
        height: 160px;
        margin: 0 0 18px;
        border-radius: 12px;
        object-fit: cover;
        background: linear-gradient(135deg, #dbe7f6, #9bb8d9);
      }
    </style>
  </head>
  <body>
    <p class="eyebrow">Mock article</p>
    <h1>ตัวอย่างเนื้อหาบทความใน iframe</h1>
    <div class="hero" role="img" aria-label="Mock hero"></div>
    <p>
      นี่คือหน้า mock สำหรับทดสอบ bottom sheet — ใช้แทน Google เพราะ
      google.com ไม่ยอมให้ฝังใน iframe (X-Frame-Options: sameorigin)
    </p>
    <p>
      เปลี่ยน URL จริงได้ภายหลังเมื่อมีหน้าบทความที่อนุญาตให้ embed ได้
    </p>
  </body>
</html>
